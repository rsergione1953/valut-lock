<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPsoft VaultLock - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1A1614;
            color: #F3F4F6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #2D2420;
            border: 1px solid #D97706;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #D97706;
            margin-bottom: 5px;
            font-size: 26px;
        }

        p {
            color: #9CA3AF;
            font-size: 13px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #D97706;
            background: #1E1916;
            color: #F3F4F6;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #D97706;
            color: #FFF;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #B45309;
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            color: #EF4444;
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="icon">🗄️</div>
        <h1>SPsoft VaultLock</h1>
        <p>Inserisci la Master Password per sbloccare la cassaforte web</p>
        <input type="password" id="masterPwd" placeholder="Master Password" onkeydown="if(event.key==='Enter') login()">
        <button onclick="login()">Sblocca Cassaforte 🔐</button>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        async function login() {
            const pwd = document.getElementById('masterPwd').value;
            const errDiv = document.getElementById('errorMsg');
            errDiv.innerText = '';

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ master_password: pwd })
            });

            const data = await res.json();
            if (res.ok && data.success) {
                window.location.reload();
            } else {
                errDiv.innerText = data.message || 'Errore di autenticazione';
            }
        }
    </script>
</body>

</html>
